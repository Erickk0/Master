# CRYME migration playbook (Step 3)
# Deploy TLS stack: ANSIBLE_CONFIG=deploy/ansible.cfg ansible-playbook -i deploy/inventory/hosts.ini deploy/playbooks/apply_tls.yml \
#   -e 'migration_step=3' -e @deploy/vars/step_3.json
# Or use: cryme deploy step=3
# Nodes in this step: Webserver_Classic.Cert_RSA2048
- name: Migrate Cert_RSA2048 to ML-DSA-44 (Step 3)
  hosts: webserver
  gather_facts: false
  vars:
    migration_step: 3
    migrated_nodes:
      - Webserver_Classic.Cert_RSA2048
    target_algorithms:
      Webserver_Classic.Cert_RSA2048: ML-DSA-44
  tasks:
    - name: Apply CRYME migration to TLS stack
      ansible.builtin.include_role:
        name: cryme_tls
