# CRYME migration playbook (Step 4)
# Deploy TLS stack: ANSIBLE_CONFIG=deploy/ansible.cfg ansible-playbook -i deploy/inventory/hosts.ini deploy/playbooks/apply_tls.yml \
#   -e 'migration_step=4' -e @deploy/vars/step_4.json
# Or use: node cryme deploy step=4
# Nodes in this step: Webserver_Classic.TLS_1.2_/_1.3_Communication
- name: Migrate 3_Communication to TLS1.3 (Step 4)
  hosts: webserver
  gather_facts: false
  vars:
    migration_step: 4
    migrated_nodes:
      - Webserver_Classic.TLS_1.2_/_1.3_Communication
    target_algorithms:
      Webserver_Classic.TLS_1.2_/_1.3_Communication: TLS1.3
  tasks:
    - name: Apply CRYME migration to TLS stack
      ansible.builtin.include_role:
        name: cryme_tls
