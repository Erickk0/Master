# CRYME Docker TLS targets — Ansible control node = university server host

[webserver]
localhost ansible_connection=local

[clients]
localhost ansible_connection=local

[webserver:vars]
nginx_container_name=cryme-nginx-classic
nginx_config_dir={{ playbook_dir }}/../nginx/live
nginx_config_path={{ nginx_config_dir }}/tls.conf
tls_listen_port=8443
cryme_deploy_root={{ playbook_dir }}/..

[clients:vars]
curl_container_name=cryme-curl-client
client_config_path={{ playbook_dir }}/../client/expect.env

[all:vars]
ansible_python_interpreter=auto_silent
