# CRYME baseline TLS — classic RSA + ECDHE, TLS 1.2/1.3
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/classic_rsa.crt;
    ssl_certificate_key /etc/nginx/certs/classic_rsa.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    add_header X-Cryme-Tls-Profile "classic-rsa-ecdhe" always;

    location /health {
        return 200 "CRYME live TLS OK (classic)\n";
        add_header Content-Type text/plain;
    }

    location = /api/status {
        default_type application/json;
        alias /state/runtime.json;
    }

    location = /api/data {
        default_type application/json;
        alias /state/data.json;
    }
}
