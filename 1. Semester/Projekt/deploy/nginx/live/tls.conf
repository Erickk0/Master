# CRYME live TLS + API state — managed by cryme_tls role (step 4)

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/migrated_ecdsa.crt;
    ssl_certificate_key /etc/nginx/certs/migrated_ecdsa.key;

    ssl_protocols TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;

    add_header X-Cryme-Tls-Profile "tls13-only" always;
    add_header X-Cryme-Migration-Step "4" always;

    location /health {
        return 200 "CRYME live TLS OK (tls13-only)\n";
        add_header Content-Type text/plain;
    }

    location = /api/status {
        default_type application/json;
        alias /state/runtime.json;
    }

    location = /api/data {
        default_type application/json;
        alias /state/data.json;
    }
}
