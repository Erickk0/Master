- name: PQC Migration Step 3
  hosts: localhost
  gather_facts: false
  vars:
    migrated_nodes:
    - Webserver_PQC.KeyExchange_ML_KEM
  tasks:
  - name: Deploy Post-Quantum Cryptographic Assets & Keys
    ansible.builtin.copy:
      content: '# PQC Migrated Keys and Algorithms

        # Node: Webserver_PQC.KeyExchange_ML_KEM -> Algorithm: X25519_MLKEM1024 (Security
        Level: 5, Key Size: 1568 bytes)

        '
      dest: /etc/pqc/keys_step_3.conf
