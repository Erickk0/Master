- name: PQC Migration Step 1
  hosts: localhost
  gather_facts: false
  vars:
    migrated_nodes:
    - Webserver_Classic.KeyExchange_ECDHE
  tasks:
  - name: Deploy Post-Quantum Cryptographic Assets & Keys
    ansible.builtin.copy:
      content: '# PQC Migrated Keys and Algorithms

        # Node: Webserver_Classic.KeyExchange_ECDHE -> Algorithm: X25519_MLKEM768
        (Security Level: 3, Key Size: 1184 bytes)

        '
      dest: /etc/pqc/keys_step_1.conf
