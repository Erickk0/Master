- name: PQC Migration Step 11
  hosts: in_vehicle_devices
  gather_facts: false
  vars:
    migrated_nodes:
    - ECU_01.Secure_Access
  tasks:
  - name: Configure and Enable PQC Security Controls
    ansible.builtin.template:
      src: templates/security_controls.conf.j2
      dest: /etc/pqc/controls_step_11.conf
  - name: Restart Migrated Services & Modules
    ansible.builtin.systemd:
      name: pqc_crypto_daemon
      state: restarted
