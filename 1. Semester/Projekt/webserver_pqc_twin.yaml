digital_twin:
  system_name: "Webserver PQC Migration Scenario"
  version: "1.0"

  components:
    # ---------------------------------------------------------
    # Zustand A: Klassischer Webserver (Pre-Quantum)
    # ---------------------------------------------------------
    - component_id: "Webserver_Classic"
      name: "Nginx Standard Webserver"
      type: "server"
      phase: 1
      not_before: []
      
      security_controls:
        - control_name: "TLS 1.2 / 1.3 Communication"
          description: "Sichert eingehenden HTTP-Traffic ab"
          
      cryptographic_assets:
        - asset_id: "Cert_RSA2048"
          asset_type: "certificate"
          algorithm: "RSA-2048"
          used_by: ["TLS 1.2 / 1.3 Communication"]
          migration_variants:
            - variant_id: "Cert_RSA2048_mldsa44"
              algorithm: "ML-DSA-44"
              security_level: 1
              key_size_bytes: 1312
              performance: "high"
            - variant_id: "Cert_RSA2048_mldsa65"
              algorithm: "ML-DSA-65"
              security_level: 3
              key_size_bytes: 1952
              performance: "medium"
        - asset_id: "KeyExchange_ECDHE"
          asset_type: "key_exchange"
          algorithm: "ECDHE"
          used_by: ["TLS 1.2 / 1.3 Communication"]
          migration_variants:
            - variant_id: "KeyExchange_ECDHE_mlkem768"
              algorithm: "X25519_MLKEM768"
              security_level: 3
              key_size_bytes: 1184
              performance: "high"

      dependencies:
        explicit: []
        implicit:
          - source: "TLS 1.2 / 1.3 Communication"
            target: "Cert_RSA2048"
            type: "intra-component"

  
  # ---------------------------------------------------------
  # Globale Abhängigkeiten (Das Client-Problem)
  # ---------------------------------------------------------
  global_dependencies:
    - dependency_id: "DEP_BROWSER_COMPATIBILITY"
      type: "communication"
      description: "Ein Standard-Browser erfordert ECDHE/RSA. Wenn der Server auf reines PQC migriert, bricht diese implizite Abhängigkeit."
      nodes:
        - "Client_Browser.KeyExchange_ECDHE"
        - "Webserver_Classic.KeyExchange_ECDHE"